name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary platform (Packet Tracer, clipboard via
        # clip.exe). Ubuntu runs the same to catch path assumptions.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        # Fixed token so the bridge tests do not touch the real token file
        # of the user who runs the runner.
        env:
          PT_MCP_BRIDGE_TOKEN: ci-token-long-enough-to-be-considered-valid-0123456789
        run: python -m pytest -q
